<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="theextractor-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="theextractor-red" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="theextractor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Container badge with sleek rounded corners -->
  <rect width="32" height="32" rx="8" fill="url(#theextractor-bg)"/>
  <rect width="31" height="31" x="0.5" y="0.5" rx="7.5" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Document Body Silhouette -->
  <path d="M8 7C8 5.89543 8.89543 5 10 5H18.5L24 10.5V25C24 26.1046 23.1046 27 22 27H10C8.89543 27 8 26.1046 8 25V7Z" fill="#27272a"/>
  
  <!-- Dog-ear fold with red accent -->
  <path d="M18.5 5V9.5C18.5 10.0523 18.9477 10.5 19.5 10.5H24L18.5 5Z" fill="url(#theextractor-red)"/>

  <!-- Heading bar: glowing crimson extract layer -->
  <rect x="11" y="13" width="9" height="2.5" rx="1.25" fill="url(#theextractor-red)"/>

  <!-- Extracted structured data lines -->
  <rect x="11" y="17.5" width="10" height="2" rx="1" fill="#a1a1aa"/>
  <rect x="11" y="21.5" width="6.5" height="2" rx="1" fill="#71717a"/>

  <!-- Precision extraction scanner bead -->
  <circle cx="21" cy="14.25" r="1.25" fill="#f87171"/>
</svg>